name: Mid Engine CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Install optional native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libassimp-dev liblua5.4-dev libpng-dev libjpeg-dev libsdl2-dev
      - name: Configure native C++20 engine
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build native engine
        run: cmake --build build --config Release --parallel 2
      - name: Test native engine
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package native SDK
        run: cpack --config build/CPackConfig.cmake -C Release -B build/packages
      - name: Upload native SDK package
        uses: actions/upload-artifact@v4
        with:
          name: mid-engine-sdk-${{ runner.os }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 14
